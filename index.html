<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misconception Survey Dashboard</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dbe3f0;
        --text: #1f2a44;
        --muted: #5f6b85;
        --primary: #3a6ff7;
        --primary-soft: #eaf0ff;
        --good: #11a875;
        --warn: #e39d1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 35%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        width: min(1100px, 92vw);
        margin: 2rem auto 3rem;
      }

      header {
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2.8vw, 2rem);
      }

      .subtitle {
        margin-top: 0.45rem;
        color: var(--muted);
      }

      .tabs {
        display: flex;
        gap: 0.5rem;
        margin: 1.25rem 0;
      }

      .tab-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        padding: 0.6rem 1rem;
        cursor: pointer;
        font-weight: 700;
      }

      .tab-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .card {
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 1rem;
        box-shadow: 0 8px 28px rgba(31, 42, 68, 0.06);
      }

      .survey-actions {
        margin-bottom: 0.85rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .link-btn {
        border: none;
        border-radius: 10px;
        background: var(--primary-soft);
        color: var(--primary);
        text-decoration: none;
        padding: 0.6rem 0.9rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
      }

      iframe {
        width: 100%;
        min-height: 72vh;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .dashboard-layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1rem;
      }

      .student-list {
        display: grid;
        gap: 0.45rem;
      }

      .student-btn {
        text-align: left;
        border: 1px solid var(--line);
        background: #fff;
        padding: 0.75rem;
        border-radius: 10px;
        cursor: pointer;
      }

      .student-btn small {
        color: var(--muted);
      }

      .student-btn.active {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.8rem;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.8rem;
        background: #fff;
      }

      .stat h3 {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .stat .value {
        margin-top: 0.45rem;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .section-title {
        margin: 1rem 0 0.6rem;
        font-weight: 700;
      }

      .bar-wrap {
        display: grid;
        gap: 0.6rem;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 1fr 70px;
        align-items: center;
        gap: 0.75rem;
      }

      .bar {
        height: 10px;
        border-radius: 999px;
        background: #eef2ff;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        background: linear-gradient(90deg, #4f7eff, #58a7ff);
      }

      .notes {
        margin-top: 1rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 0.85rem;
        background: #fff;
      }

      .notes p {
        margin: 0.3rem 0;
      }

      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 0.2rem 0.55rem;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .good {
        color: var(--good);
        background: #e9fbf5;
      }

      .warn {
        color: var(--warn);
        background: #fff5e5;
      }

      @media (max-width: 900px) {
        .dashboard-layout {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>오개념 설문 + 개인 대시보드</h1>
        <p class="subtitle">
          한 페이지에서 설문을 진행하고, 학생별 응답 결과를 바로 대시보드로 확인할 수 있습니다.
        </p>
      </header>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="survey">설문 실행</button>
        <button class="tab-btn" data-tab="dashboard">개인별 대시보드</button>
      </nav>

      <section id="survey" class="tab-panel active">
        <div class="card">
          <div class="survey-actions">
            <a
              class="link-btn"
              href="https://docs.google.com/forms/d/1lQbROC56ycqAwg3A6YjaP19oUDXIO4QMZ-_JlrN3Dso/viewform"
              target="_blank"
              rel="noreferrer"
              >새 탭에서 설문 열기</a
            >
          </div>
          <iframe
            title="Google Form"
            src="https://docs.google.com/forms/d/1lQbROC56ycqAwg3A6YjaP19oUDXIO4QMZ-_JlrN3Dso/viewform?embedded=true"
          ></iframe>
        </div>
      </section>

      <section id="dashboard" class="tab-panel">
        <div class="dashboard-layout">
          <aside class="card">
            <h2 style="margin-top: 0">응답자 목록</h2>
            <p class="subtitle" style="margin-top: 0">학생을 선택하면 개인 리포트를 표시합니다.</p>
            <div class="student-list" id="student-list"></div>
          </aside>

          <section class="card">
            <h2 id="student-name" style="margin-top: 0">-</h2>
            <p id="student-summary" class="subtitle">-</p>

            <div class="stats" id="stats"></div>

            <h3 class="section-title">영역별 이해도</h3>
            <div class="bar-wrap" id="bars"></div>

            <div class="notes">
              <strong>교사용 메모</strong>
              <p id="teacher-note">-</p>
              <span class="badge" id="risk-badge">-</span>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const responses = [
        {
          name: "김민지",
          classInfo: "2학년 3반 / 응답일: 2026-02-20",
          completion: 100,
          misconceptionCount: 4,
          avgConfidence: 72,
          risk: "attention",
          note: "분수/비율 단원에서 반복 오답이 확인되어 보충 자료 권장.",
          domains: [
            { label: "개념 이해", score: 81 },
            { label: "문제 적용", score: 66 },
            { label: "자기 확신", score: 72 }
          ]
        },
        {
          name: "박준호",
          classInfo: "2학년 3반 / 응답일: 2026-02-21",
          completion: 100,
          misconceptionCount: 2,
          avgConfidence: 84,
          risk: "stable",
          note: "대부분 문항에서 개념-정답 일치. 심화 문제 제공 가능.",
          domains: [
            { label: "개념 이해", score: 88 },
            { label: "문제 적용", score: 80 },
            { label: "자기 확신", score: 84 }
          ]
        },
        {
          name: "이서윤",
          classInfo: "2학년 3반 / 응답일: 2026-02-21",
          completion: 92,
          misconceptionCount: 5,
          avgConfidence: 60,
          risk: "attention",
          note: "응답 미완료 문항이 있어 재응답 유도 필요.",
          domains: [
            { label: "개념 이해", score: 63 },
            { label: "문제 적용", score: 55 },
            { label: "자기 확신", score: 60 }
          ]
        }
      ];

      const studentList = document.getElementById("student-list");
      const studentName = document.getElementById("student-name");
      const studentSummary = document.getElementById("student-summary");
      const stats = document.getElementById("stats");
      const bars = document.getElementById("bars");
      const teacherNote = document.getElementById("teacher-note");
      const riskBadge = document.getElementById("risk-badge");

      function renderStudent(index) {
        const data = responses[index];
        studentName.textContent = data.name;
        studentSummary.textContent = data.classInfo;

        stats.innerHTML = `
          <article class="stat">
            <h3>설문 완료율</h3>
            <div class="value">${data.completion}%</div>
          </article>
          <article class="stat">
            <h3>오개념 의심 문항</h3>
            <div class="value">${data.misconceptionCount}개</div>
          </article>
          <article class="stat">
            <h3>평균 확신도</h3>
            <div class="value">${data.avgConfidence}점</div>
          </article>
        `;

        bars.innerHTML = data.domains
          .map(
            (domain) => `
              <div class="bar-row">
                <div>
                  <div style="font-size:0.9rem;margin-bottom:0.3rem;color:var(--muted)">${domain.label}</div>
                  <div class="bar"><div class="fill" style="width:${domain.score}%"></div></div>
                </div>
                <strong>${domain.score}점</strong>
              </div>
            `
          )
          .join("");

        teacherNote.textContent = data.note;

        riskBadge.textContent =
          data.risk === "stable" ? "학습 안정" : "집중 케어 필요";
        riskBadge.className = `badge ${data.risk === "stable" ? "good" : "warn"}`;

        [...studentList.children].forEach((btn, i) => {
          btn.classList.toggle("active", i === index);
        });
      }

      responses.forEach((student, index) => {
        const button = document.createElement("button");
        button.className = "student-btn";
        button.innerHTML = `${student.name}<br /><small>${student.classInfo}</small>`;
        button.addEventListener("click", () => renderStudent(index));
        studentList.appendChild(button);
      });

      renderStudent(0);

      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.toggle("active", b === button));

          document.querySelectorAll(".tab-panel").forEach((panel) => {
            panel.classList.toggle("active", panel.id === button.dataset.tab);
          });
        });
      });
    </script>
  </body>
</html>
